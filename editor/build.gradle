plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

javafx {
    version = "25"
    modules = [ 'javafx.controls' ]
}

group 'org.dozingcatsoftware'
version '1.0-SNAPSHOT'

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            // Built-in table definitions are shared with the Android app.
            srcDirs "resources", "../shared-assets"
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
    }
}

// Game messages come from the Android app's string resources; see StringResolver.
processResources {
    from('../app/src/main/res/values/strings.xml') {
        into 'strings'
    }
}

test {
    // Used by StringResolverTest to check that all message keys used in core are defined.
    systemProperty 'vectorpinball.coreSourceDir', file('../core/src/main/java').absolutePath
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
    implementation "com.googlecode.json-simple:json-simple:1.1.1"
    implementation group: 'org.apache.groovy', name: 'groovy', version: '5.0.1'

    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'com.dozingcatsoftware.vectorpinball.editor.Main'
}

// Renders a table JSON file to a PNG image. Usage:
// ./gradlew :editor:renderTable -Ptable=shared-assets/tables/table1.json -Pout=/tmp/table1.png
// Loads a table JSON file and simulates a game headlessly to check for errors. Usage:
// ./gradlew :editor:smokeTestTable -Ptable=shared-assets/tables/table1.json
// Paths are relative to the repository root.
tasks.register('smokeTestTable', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.projectDir
    mainClass = 'com.dozingcatsoftware.vectorpinball.editor.tools.TableSmokeTest'
    args = [
        project.findProperty('table') ?: 'shared-assets/tables/table1.json',
        project.findProperty('seconds') ?: '120',
    ]
}

tasks.register('renderTable', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.projectDir
    mainClass = 'com.dozingcatsoftware.vectorpinball.editor.tools.TableImageRenderer'
    args = [
        project.findProperty('table') ?: 'shared-assets/tables/table1.json',
        project.findProperty('out') ?: 'table.png',
        project.findProperty('imageHeight') ?: '1200',
    ] + (project.hasProperty('game') ? ['--game'] : [])
}
